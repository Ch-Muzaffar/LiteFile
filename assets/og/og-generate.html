<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Image Generator — LiteFile</title>
  <meta name="robots" content="noindex" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1117;
      color: #f1f5f9;
      padding: 40px 32px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    .instructions {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 680px;
      margin-bottom: 48px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
    }

    .instructions strong { color: #f1f5f9; }

    .card-group {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .card-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-filename {
      font-size: 12px;
      font-weight: 600;
      color: #6366f1;
      font-family: monospace;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      transition: background 150ms;
    }

    .download-btn:hover { background: #818cf8; }
    .download-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── OG card canvas at half scale (600x315) ── */
    .og-card-wrap {
      width: 600px;
      height: 315px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    /* ── OG card — actual dimensions rendered at 50% scale via transform ── */
    .og-card {
      width: 1200px;
      height: 630px;
      transform: scale(0.5);
      transform-origin: top left;

      background: #08090d;
      position: relative;
      overflow: hidden;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Background glow */
    .og-card::before {
      content: '';
      position: absolute;
      top: -200px;
      left: -100px;
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(99,102,241,0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Subtle grid pattern */
    .og-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .og-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .og-logo-icon {
      width: 52px;
      height: 52px;
      background: #6366f1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .og-logo-text {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f1f5f9;
    }

    .og-logo-text span { color: #6366f1; }

    .og-main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0 20px;
    }

    .og-category {
      font-size: 18px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6366f1;
      margin-bottom: 20px;
    }

    .og-title {
      font-size: 68px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: #f1f5f9;
      margin-bottom: 24px;
    }

    .og-desc {
      font-size: 24px;
      color: #94a3b8;
      line-height: 1.5;
      max-width: 820px;
    }

    .og-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .og-url {
      font-size: 20px;
      font-weight: 500;
      color: #475569;
      letter-spacing: 0.01em;
    }

    .og-badge {
      display: flex;
      gap: 16px;
    }

    .og-badge span {
      font-size: 16px;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.3);
      color: #818cf8;
    }
  </style>
</head>
<body>
  <h1>LiteFile — OG Image Generator</h1>
  <div class="instructions">
    <strong>How to use:</strong> Click <strong>Download PNG</strong> on each card below. The PNG file will be saved to your downloads folder — move it to <code>assets/og/</code> in your project.<br><br>
    Each card renders at exactly <strong>1200 × 630 px</strong> (displayed at 50% scale here). The downloaded PNG is full resolution.
  </div>

  <!-- Load html2canvas for PNG generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <div class="card-group" id="card-group"></div>

  <script>
    const cards = [
      {
        filename: 'home.png',
        category: 'Image & PDF Tools',
        title: 'Free Online\nFile Tools',
        desc: 'Compress, resize, convert, merge, split, remove backgrounds.\n100% in your browser — nothing uploaded, ever.',
        badges: ['Free forever', 'No sign-up', 'No uploads']
      },
      {
        filename: 'compress-image.png',
        category: 'Image Tool',
        title: 'Compress\nImage Online',
        desc: 'Reduce JPG, PNG, and WebP file sizes without losing quality.\nFast, free, 100% in your browser.',
        badges: ['JPG · PNG · WebP', 'Batch support', 'No uploads']
      },
      {
        filename: 'resize-image.png',
        category: 'Image Tool',
        title: 'Resize Image\nOnline Free',
        desc: 'Resize by pixels or percentage. Aspect ratio lock, format selector,\nlive preview. Runs entirely in your browser.',
        badges: ['JPG · PNG · WebP', 'Live preview', 'No uploads']
      },
      {
        filename: 'heic-to-jpg.png',
        category: 'Image Converter',
        title: 'Convert HEIC\nto JPG Free',
        desc: 'Convert iPhone HEIC photos to JPG instantly.\nBatch conversion, quality control, free ZIP download.',
        badges: ['HEIC · HEIF', 'Batch convert', 'No uploads']
      },
      {
        filename: 'remove-background.png',
        category: 'AI Tool',
        title: 'Remove Image\nBackground Free',
        desc: 'AI-powered background removal running entirely in your browser.\nNo upload, no account, transparent PNG output.',
        badges: ['AI-powered', 'PNG output', 'No uploads']
      },
      {
        filename: 'compress-pdf.png',
        category: 'PDF Tool',
        title: 'Compress PDF\nOnline Free',
        desc: 'Reduce PDF file size without quality loss.\nFree, fast, 100% client-side — no upload to any server.',
        badges: ['PDF', 'Fast', 'No uploads']
      },
      {
        filename: 'merge-pdf.png',
        category: 'PDF Tool',
        title: 'Merge PDF\nFiles Free',
        desc: 'Combine multiple PDF files into one.\nDrag to reorder pages, then download the merged result.',
        badges: ['Multiple PDFs', 'Reorder pages', 'No uploads']
      },
      {
        filename: 'split-pdf.png',
        category: 'PDF Tool',
        title: 'Split PDF\nOnline Free',
        desc: 'Extract pages, split by range, or separate every page.\nDownload as individual PDFs or a ZIP archive.',
        badges: ['Page ranges', 'ZIP download', 'No uploads']
      },
      {
        filename: 'convert-image.png',
        category: 'Image Converter',
        title: 'Convert Image\nFormat Free',
        desc: 'Convert between JPG, PNG, WebP, BMP, and HEIC formats.\nBatch convert multiple files and download as ZIP.',
        badges: ['JPG · PNG · WebP · BMP', 'Batch convert', 'No uploads']
      },
      {
        filename: 'qr-code.png',
        category: 'Utility Tool',
        title: 'QR Code\nGenerator Free',
        desc: 'Generate QR codes for URLs, text, or contact info.\nCustom colours, error correction, PNG and SVG export.',
        badges: ['PNG · SVG export', 'Custom colours', 'No uploads']
      },
      {
        filename: 'video-to-mp3.png',
        category: 'Audio Tool',
        title: 'Video to MP3\nConverter Free',
        desc: 'Extract audio from MP4, MOV, AVI, MKV, and WebM videos.\nFFmpeg WebAssembly — runs entirely in your browser.',
        badges: ['MP3 · M4A', 'WebAssembly', 'No uploads']
      },
      {
        filename: 'about.png',
        category: 'About LiteFile',
        title: 'Free, Private\nBrowser Tools',
        desc: 'No uploads. No account. No tracking.\nEvery tool runs entirely in your browser.',
        badges: ['No uploads', 'Free forever', 'Open source']
      }
    ];

    function buildCard(card, index) {
      const titleLines = card.title.split('\n');
      const descLines  = card.desc.split('\n');

      return `
      <div class="card-row">
        <div class="card-meta">
          <span class="card-filename">assets/og/${card.filename}</span>
          <button class="download-btn" onclick="downloadCard(${index}, '${card.filename}')" id="btn-${index}">
            Download PNG
          </button>
        </div>
        <div class="og-card-wrap">
          <div class="og-card" id="card-${index}">
            <div class="og-top">
              <div class="og-logo-icon">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                  <rect x="3.5" y="2.5" width="4.5" height="17" rx="1.5" fill="white"/>
                  <rect x="3.5" y="15" width="15" height="4.5" rx="1.5" fill="white"/>
                </svg>
              </div>
              <div class="og-logo-text">Lite<span>File</span></div>
            </div>
            <div class="og-main">
              <div class="og-category">${card.category}</div>
              <div class="og-title">${titleLines.join('<br>')}</div>
              <div class="og-desc">${descLines.join('<br>')}</div>
            </div>
            <div class="og-bottom">
              <div class="og-url">litefile.cloud</div>
              <div class="og-badge">
                ${card.badges.map(b => `<span>${b}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      </div>`;
    }

    // Render all cards
    const group = document.getElementById('card-group');
    group.innerHTML = cards.map((c, i) => buildCard(c, i)).join('');

    async function downloadCard(index, filename) {
      const btn = document.getElementById(`btn-${index}`);
      const card = document.getElementById(`card-${index}`);
      btn.disabled = true;
      btn.textContent = 'Generating…';

      try {
        const canvas = await html2canvas(card, {
          width: 1200,
          height: 630,
          scale: 1,
          useCORS: true,
          backgroundColor: '#08090d',
          logging: false
        });

        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          btn.disabled = false;
          btn.textContent = 'Downloaded!';
          setTimeout(() => { btn.textContent = 'Download PNG'; }, 2500);
        }, 'image/png');
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Failed — try again';
      }
    }

    // "Download All" button at top
    const allBtn = document.createElement('button');
    allBtn.className = 'download-btn';
    allBtn.style.cssText = 'margin-bottom: 40px; font-size: 14px; padding: 10px 24px;';
    allBtn.textContent = 'Download All PNGs';
    allBtn.onclick = async () => {
      allBtn.disabled = true;
      for (let i = 0; i < cards.length; i++) {
        await downloadCard(i, cards[i].filename);
        await new Promise(r => setTimeout(r, 400));
      }
      allBtn.disabled = false;
      allBtn.textContent = 'All downloaded!';
    };
    group.parentNode.insertBefore(allBtn, group);
  </script>
</body>
</html>

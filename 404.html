<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — LiteFile</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    /* ── 404 page ── */
    .not-found-page {
      min-height: calc(100vh - var(--nav-h) - 200px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--s9) var(--s5) var(--s8);
    }

    .not-found-inner {
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .not-found-code {
      font-size: 140px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
      margin-bottom: var(--s5);
      background: linear-gradient(160deg, var(--bg-elevated) 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    .not-found-title {
      font-size: var(--text-xl);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin-bottom: var(--s3);
    }

    .not-found-desc {
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: var(--s6);
    }

    .not-found-actions {
      display: flex;
      gap: var(--s3);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--s7);
    }

    .not-found-divider {
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: var(--s3);
    }

    .not-found-tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--s2);
      text-align: left;
    }

    .not-found-tool-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      padding: var(--s3) var(--s4);
      border-radius: var(--r-md);
      background: var(--bg-glass);
      border: 1px solid var(--glass-border);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text-secondary);
      transition: color var(--t) var(--ease),
                  background var(--t) var(--ease),
                  border-color var(--t) var(--ease);
    }

    .not-found-tool-link:hover {
      color: var(--text-primary);
      background: var(--accent-subtle);
      border-color: rgba(99, 102, 241, 0.25);
    }

    .not-found-tool-arrow {
      color: var(--text-muted);
      transition: color var(--t) var(--ease), transform var(--t) var(--ease);
      flex-shrink: 0;
    }

    .not-found-tool-link:hover .not-found-tool-arrow {
      color: var(--accent);
      transform: translateX(2px);
    }

    @media (max-width: 480px) {
      .not-found-code { font-size: 100px; }
      .not-found-tools { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav-slot"></div>

  <main>
    <div class="not-found-page">
      <div class="not-found-inner">

        <div class="not-found-code" aria-hidden="true">404</div>

        <h1 class="not-found-title">Page not found</h1>
        <p class="not-found-desc">
          This page doesn't exist or may have been moved.<br>
          Head back to the homepage or jump straight to a tool.
        </p>

        <div class="not-found-actions">
          <a href="/" class="btn btn-primary">Go to homepage</a>
          <a href="/about" class="btn btn-secondary">About LiteFile</a>
        </div>

        <p class="not-found-divider">Popular tools</p>
        <nav class="not-found-tools" aria-label="Popular tools">
          <a href="/compress-image" class="not-found-tool-link">
            <span>Compress Image</span>
            <span class="not-found-tool-arrow" aria-hidden="true">&#8594;</span>
          </a>
          <a href="/resize-image" class="not-found-tool-link">
            <span>Resize Image</span>
            <span class="not-found-tool-arrow" aria-hidden="true">&#8594;</span>
          </a>
          <a href="/remove-background" class="not-found-tool-link">
            <span>Remove Background</span>
            <span class="not-found-tool-arrow" aria-hidden="true">&#8594;</span>
          </a>
          <a href="/heic-to-jpg" class="not-found-tool-link">
            <span>HEIC to JPG</span>
            <span class="not-found-tool-arrow" aria-hidden="true">&#8594;</span>
          </a>
          <a href="/compress-pdf" class="not-found-tool-link">
            <span>Compress PDF</span>
            <span class="not-found-tool-arrow" aria-hidden="true">&#8594;</span>
          </a>
          <a href="/merge-pdf" class="not-found-tool-link">
            <span>Merge PDF</span>
            <span class="not-found-tool-arrow" aria-hidden="true">&#8594;</span>
          </a>
        </nav>

      </div>
    </div>
  </main>

  <div id="footer-slot"></div>
  <script src="assets/utils.js"></script>
</body>
</html>
